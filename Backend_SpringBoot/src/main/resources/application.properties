spring.application.name=dashboard-registry-backend

# --- Database: SQLite (single file, no server, no password) ---
# The path is relative to the folder the backend is started from (the project folder).
spring.datasource.url=jdbc:sqlite:./data/dashboard_registry.db
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows one writer at a time: a single connection avoids "database is locked" errors
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.connection-init-sql=PRAGMA foreign_keys = ON

# --- Schema + demo data ---
# On every start: create the tables if they are missing and insert the demo rows if they are missing.
# Changes made while presenting are kept. To start over, delete data/dashboard_registry.db and restart.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.sql.init.data-locations=classpath:db/data.sql

# Allowed frontend origin(s) for CORS, comma separated (used by com.example.config.CorsConfig)
app.cors.allowed-origins=http://localhost:5173
